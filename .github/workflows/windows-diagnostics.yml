name: Windows performance diagnosis
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: ilammy/msvc-dev-cmd@v1
        with: {arch: x64}
      - shell: pwsh
        run: '"C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH'
      - run: python -m pip install numpy
      - shell: bash
        run: python -B tools/ci.py cores --root "$RUNNER_TEMP/spectral"
      - name: Record flags and DLL dependencies
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP/spectral"
          New-Item -ItemType Directory -Force "$root/evidence"
          Get-ChildItem "$root/cores" -Filter CMakeCache.txt -Recurse | ForEach-Object { "`nFILE $_"; Get-Content $_ | Select-String 'CMAKE_BUILD_TYPE|CMAKE_CXX_FLAGS|CMAKE_CXX_COMPILER|LIBOMP|OPENMP' } | Out-File "$root/evidence/flags.txt"
          ninja -C "$root/cores/bunch" -t commands | Out-File "$root/evidence/commands.txt"
          dumpbin /dependents "$root/cores/bunch/specbunch.dll" | Out-File "$root/evidence/dependents.txt"
          Get-CimInstance Win32_Processor | Format-List * | Out-File "$root/evidence/cpu.txt"
      - name: Time simulated fixtures by thread count and wait policy
        shell: bash
        run: python -B tools/diagnose_windows.py --library "$RUNNER_TEMP/spectral/cores/bunch/specbunch.dll" --output "$RUNNER_TEMP/spectral/evidence/timings.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-performance-evidence
          path: ${{ runner.temp }}/spectral/evidence
          retention-days: 7
